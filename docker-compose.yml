services:
  postgres:
    image: postgres:18-alpine

    container_name: brevly-postgres

    restart: unless-stopped

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: brevly

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d brevly"]
      interval: 5s
      timeout: 5s
      retries: 5

    networks:
      - brevly

  server:
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/brevly

    build:
      context: .
      dockerfile: server/Dockerfile

    container_name: brevly-server

    restart: unless-stopped

    env_file:
      - ./server/.env

    depends_on:
      postgres:
        condition: service_healthy

    ports:
      - "3333:3333"

    networks:
      - brevly

  migration:
    profiles:
      - tools
    restart: "no"

    build:
      context: .
      dockerfile: server/Dockerfile
      target: migration
    container_name: brevly-migration

    env_file:
      - server/.env

    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/brevly

    depends_on:
      postgres:
        condition: service_healthy

    command: sh -c "cd server && ./node_modules/.bin/drizzle-kit migrate --config drizzle.config.ts"

    networks:
      - brevly

  seed:
    profiles:
      - tools
    restart: "no"

    build:
      context: .
      dockerfile: server/Dockerfile
      target: seed

    container_name: brevly-seed

    env_file:
      - server/.env

    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/brevly

    depends_on:
      postgres:
        condition: service_healthy

    command: pnpm --filter server db:seed

    networks:
      - brevly

  web:
    build:
      context: .
      dockerfile: web/Dockerfile
      args:
        VITE_BACKEND_URL: /api

    container_name: brevly-web

    restart: unless-stopped

    ports:
      - "3000:80"

    depends_on:
      - server

    networks:
      - brevly

volumes:
  postgres_data:

networks:
  brevly:
